# Render deployment.
#
# This is the recommended host, because it can provision the database in
# the same file as the service. Deploy this blueprint and you get a web
# service and a Postgres instance already wired to each other, which is
# the difference between an app that remembers your account and one that
# forgets it.
#
# Why Postgres rather than the SQLite file this app used to run on: a
# container filesystem is rebuilt on every deploy, and a free service
# also sleeps after about fifteen minutes of no traffic and wakes up
# fresh. That was tolerable when the app was single user and the only
# casualty was demo data. With accounts it is not: people would lose the
# login they just created.
#
# SQLite is still the default with no DATABASE_URL set, which is what you
# want when running locally.
#
# Two things about the free plan worth knowing before the demo:
#
#   A free Postgres expires 30 days after it is created, and only one can
#   be active per workspace. Created today that is fine through the
#   presentation, but check the dashboard before relying on it later.
#
#   A free web service sleeps after about fifteen minutes of no traffic
#   and takes roughly a minute to wake. The data is unaffected: it lives
#   in the database, not in the container.

databases:
  - name: health-coach-db
    databaseName: health_coach
    user: health_coach
    plan: free
    postgresMajorVersion: "16"

# No region is set on either the database or the service. Render then puts
# both in its default, which is the point: they have to match, because the
# service reaches the database over Render's internal network. If you move
# one to Singapore for the latency, move both in the same commit.

services:
  - type: web
    name: health-coach
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health

    envVars:
      # Wired by Render from the database above. Nothing to copy by hand,
      # and the password never appears in this file.
      - key: DATABASE_URL
        fromDatabase:
          name: health-coach-db
          property: connectionString

      # Signs the session cookie. Render generates it once and keeps it,
      # so a redeploy does not sign everybody out.
      - key: SECRET_KEY
        generateValue: true

      - key: MOCK_MODE
        value: "false"

      - key: PYTHON_VERSION
        value: "3.11.0"

      # Set these in the Render dashboard. sync: false means Render will
      # prompt for them and they never live in this file.
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        sync: false
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        sync: false
      - key: AZURE_CONTENT_SAFETY_ENDPOINT
        sync: false
      - key: AZURE_CONTENT_SAFETY_KEY
        sync: false
